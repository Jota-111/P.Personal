<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>

    <h1>Registro de Estudiante</h1>
    <form>
        <label for="nombre completo">Nombre completo</label>
        <input id="nombre completo" name="nombre" placeholder="Aqui va el nombre" required><br><br>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="Aqui va el correo required"><br><br> 

        <label for="Contraseña">Contraseña</label>
        <input type="password" id="Contraseña" name="Contraseña required" 
        placeholder="Aqui va la contraseña"><br><br>

        <label for="Contraseña">Confirmar Contraseña</label>
        <input type="password" id="Contraseña" name="Contraseña" 
        placeholder="Aqui va la contraseña"><br><br>

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="Edad" placeholder="Aqui va la edad"><br><br>

        <label for="fecha de nacimiento">Fecha de Nacimiento</label>
        <input type="date" id="fecha de nacimiento" name="Fecha" placeholder="Aqui va la fecha"><br><br>

        <label for="ciudad">Elige tu Ciudad</label>
        <select name="ciudad" id="ciudad"> 
            <option value="" disabled selected>Selecciona una opcion</option>
            <option value="santa-marta">Santa Marta</option>
            <option value="barranquilla">Barranquilla</option>
            <option value="cartagena">Cartagena</option>
        </select><br><br>

        <label for="texto">Tecnologias que quieres Aprender</label><br>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="lenguaje"><br>

        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="CSS"><br>

        <label for="javascripst">JavaScript</label>
        <input type="checkbox" id="javascripst" name="JavaScript"><br><br>

        <legend>Nivel de Experiencia</legend>
        <label for="principiante">Principiante</label>
        <input type="radio" id="principiante" name="principiante">

        <label for="intermedio">Intermedio</label>
        <input type="radio" id="intermedio" name="intermedio">

        <label for="avanzado">Avanzado</label>
        <input type="radio" id="avanzado" name="avanzado"><br><br>

        <label for="por que quieres aprender programacion">Por que quieres aprender Programacion</label><br>
        <textarea id="por que quieres aprender programacion" 
        placeholder="escriba texto" name="por que quieres aprender programacion"></textarea><br>

        <input type="submit">

    </form>
</body>
</html>
